# Pushing a tag such as v0.1.0 builds, publishes, and verifies a release. A tag with a
# pre-release suffix (v0.1.0-rc.1) is published as a GitHub pre-release, which the install
# scripts' "latest" and `shipshape update` ignore. The tag must match package.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "22"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Tag matches package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          if [ "$version" != "$package" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-latest }
          - { target: windows-x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      # The build script also checks that the binary reports $VERSION.
      - run: bun scripts/build-binary.ts --target "$TARGET" --version "$VERSION" --out release
      - name: Smoke test
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          if [ "$TARGET" = windows-x64 ]; then
            /c/Windows/System32/tar.exe -xf "release/shipshape-$TARGET.zip" -C "$smoke"
            bin="$smoke/shipshape.exe"
          else
            tar -xzf "release/shipshape-$TARGET.tar.gz" -C "$smoke"
            bin="$smoke/shipshape"
          fi
          test "$("$bin" --version | tr -d '\r')" = "$VERSION"
          "$bin" --help > /dev/null
          # A full-codebase review without a model must fail setup cleanly with JSON on stdout.
          cd "$RUNNER_TEMP" && mkdir -p review && cd review && echo "print(1)" > main.py
          set +e
          "$bin" review --all --format json > result.json
          code=$?
          set -e
          test "$code" = 2
          grep -q '"reason": "config_error"' result.json
      - name: OAuth sign-in is bundled
        if: runner.os == 'Linux'
        run: |
          # Without Pi's Bun setup, compiled builds cannot load OAuth flows. Start a sign-in in a
          # pseudo-terminal and stop at the method prompt; nothing is sent or stored.
          out=$(env -u CI timeout 10 script -qec "$RUNNER_TEMP/smoke/shipshape login openai-codex --auth-file $RUNNER_TEMP/auth.json" /dev/null || true)
          echo "$out" | grep -q "OpenAI Codex login method"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          sha256sum shipshape-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          cp install.sh install.ps1 release/
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Ship Shape $GITHUB_REF_NAME" --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" release/*

  verify:
    name: Install on ${{ matrix.runner }}
    needs: [check, publish]
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    env:
      SHIPSHAPE_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" | sh
          test "$("$HOME/.local/bin/shipshape" --version)" = "$SHIPSHAPE_VERSION"
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/install.ps1" | iex
          $version = (& "$env:LOCALAPPDATA\Programs\shipshape\shipshape.exe" --version | Out-String).Trim()
          if ($version -ne $env:SHIPSHAPE_VERSION) { throw "Installed $version, expected $env:SHIPSHAPE_VERSION" }
